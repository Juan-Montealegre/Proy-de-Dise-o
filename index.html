<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-form">
        <h2>Iniciar Sesión / Registrarse</h2>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <select id="role-select">
            <option value="user">Usuario</option>
            <option value="admin">Administrador</option>
        </select>
        <p id="mensaje"></p>
        <div class="button-group">
            <button id="login-button">Ingresar</button>
            <button id="register-button">Registrarse</button>
            <button id="voice-login">Iniciar Sesión por Voz</button>
            <button id="voice-register">Registrarse por Voz</button>
        </div>
    </div>

    <div class="container" style="display: none;">
        <h1>Registro de Asistencia</h1>
        <button id="logout-button">Cerrar Sesión</button>
        <p>Presiona el botón para registrar tu asistencia.</p>
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <button id="capture">Capturar Asistencia</button>

        <h2>Lista de Asistencia</h2>
        <table id="attendance-table">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="admin-panel" class="admin-container" style="display: none;">
        <h2>Panel de Administrador</h2>
        <table>
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="admin-attendance"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>

    <script src="script.js"></script>
</body>
</html>
