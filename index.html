<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Asistencia</title>
  <script type="module" src="https://cdn.sheetjs.com/xlsx-0.20.0/package/xlsx.mjs"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(255, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
        url("https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Escudo_de_la_Universidad_Libre_de_Colombia.svg/2048px-Escudo_de_la_Universidad_Libre_de_Colombia.svg.png")
        no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .container, #login-form {
      margin: 50px auto;
      padding: 20px;
      background: white;
      width: 90%;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      color: #000;
    }

    h2, h3 {
      color: #b71c1c;
    }

    button {
      margin-top: 15px;
      padding: 15px 25px;
      border: none;
      background: #d32f2f;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #000000;
      transform: scale(1.05);
    }

    input, select {
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .video-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 320px;
      height: 240px;
      margin: 20px auto;
      background: black;
      border-radius: 10px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      color: black;
      border-radius: 5px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #d32f2f;
      color: white;
    }

    .admin-container {
      display: none;
    }

    #loader {
      font-weight: bold;
      margin-top: 15px;
      color: green;
      display: none;
    }

    .flash {
      animation: flash 0.3s ease-in-out;
    }

    @keyframes flash {
      0% { background-color: #d32f2f; }
      100% { background-color: #000; }
    }

    .delete-btn {
      background-color: #e53935;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .delete-btn:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>
  <div id="login-form">
    <h2>🎓 Registro de Asistencia</h2>
    <input type="text" id="username" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <select id="role-select">
      <option value="Usuario">Docente</option>
      <option value="admin">Administrador</option>
    </select>
    <button id="login-button">🔓 Iniciar sesión</button>
    <button id="register-button">📝 Registrarse</button>
    <button id="voice-login">🎤 Iniciar con voz</button>
    <button id="voice-register">🎤 Registrar con voz</button>
    <p id="mensaje"></p>
    <p id="feedback"></p>
  </div>

  <div class="container" style="display:none;">
    <h2>Bienvenido</h2>
    <div class="video-container"><video id="video" autoplay></video></div>
    <button id="capture">✅ Registrar Asistencia</button>
    <p id="loader">Registrando asistencia...</p>
    <button id="logout-button">⏏️ Cerrar sesión</button>

    <h3>📊 Asistencia registrada</h3>
    <table id="attendance-table">
      <thead><tr><th>Usuario</th><th>Fecha</th><th>Hora</th></tr></thead>
      <tbody></tbody>
    </table>

    <div id="admin-panel" class="admin-container">
      <h3>🛠 Panel de Administrador</h3>
      <button id="download-excel">📥 Descargar Excel</button>
      <table id="admin-attendance">
        <thead><tr><th>Usuario</th><th>Rol</th><th>Fecha</th><th>Hora</th><th>Acción</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
    import * as XLSX from "https://cdn.sheetjs.com/xlsx-0.20.0/package/xlsx.mjs";

    const firebaseConfig = {
      apiKey: "AIzaSyBQFdu36zRwL8OpoX6883pOuDyqcakfurY",
      authDomain: "asistencia-docentes-9de71.firebaseapp.com",
      databaseURL: "https://asistencia-docentes-9de71-default-rtdb.firebaseio.com",
      projectId: "asistencia-docentes-9de71",
      storageBucket: "asistencia-docentes-9de71.appspot.com",
      messagingSenderId: "933641363169",
      appId: "1:933641363169:web:5001d5ad0a37a0e4e8e1a0",
      measurementId: "G-HYF7KLQ5NZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.addEventListener("DOMContentLoaded", () => {
      const $ = id => document.getElementById(id);
      const users = JSON.parse(localStorage.getItem("users")) || {};
      let currentUser = "", userRole = "", stream = null;

      const video = $("video");
      const feedback = $("feedback");
      const mensaje = $("mensaje");
      const loader = $("loader");

      // Guardaremos las asistencias cargadas hoy con sus keys para evitar duplicados y permitir eliminación
      let attendanceRecords = {};

      const showError = msg => { mensaje.textContent = `⚠️ ${msg}`; mensaje.style.color = "red"; };
      const showSuccess = msg => {
        feedback.textContent = msg;
        feedback.style.color = "green";
        setTimeout(() => feedback.textContent = "", 3000);
      };

      const startCamera = async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
        } catch { showError("No se pudo acceder a la cámara."); }
      };

      const stopCamera = () => stream?.getTracks().forEach(track => track.stop());

      const login = (user, pass) => {
        if (users[user]?.password === pass) {
          currentUser = user;
          userRole = users[user].role;
          $("login-form").style.display = "none";
          document.querySelector(".container").style.display = "block";
          $("admin-panel").style.display = userRole === "admin" ? "block" : "none";
          startCamera();
          cargarAsistencia();
        } else showError("Credenciales incorrectas");
      };

      const register = (user, pass, role) => {
        if (!user || !pass) return showError("Usuario y contraseña requeridos");
        if (users[user]) return showError("Usuario ya existe");
        users[user] = { password: pass, role };
        localStorage.setItem("users", JSON.stringify(users));
        showSuccess("Usuario registrado con éxito");
      };

      const hoyFecha = () => new Date().toISOString().slice(0, 10); // yyyy-mm-dd

      const cargarAsistencia = () => {
        const attendanceRef = ref(db, "asistencias");
        onValue(attendanceRef, (snapshot) => {
          attendanceRecords = {};
          const data = snapshot.val() || {};
          // Limpiar tablas
          $("attendance-table").querySelector("tbody").innerHTML = "";
          $("admin-attendance").querySelector("tbody").innerHTML = "";

          Object.entries(data).forEach(([key, { user, role, date, time }]) => {
            if (date === hoyFecha()) {
              attendanceRecords[`${user}_${date}`] = key;

              // Para todos los usuarios mostramos en tabla principal
              const row = document.createElement("tr");
              row.innerHTML = `<td>${user}</td><td>${date}</td><td>${time}</td>`;
              $("attendance-table").querySelector("tbody").appendChild(row);

              // Si admin, mostramos tabla con acciones
              if (userRole === "admin") {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${user}</td><td>${role}</td><td>${date}</td><td>${time}</td>
                  <td><button class="delete-btn" data-key="${key}">Eliminar</button></td>`;
                $("admin-attendance").querySelector("tbody").appendChild(tr);
              }
            }
          });

          if (userRole === "admin") {
            // Agregar evento click a botones eliminar
            document.querySelectorAll(".delete-btn").forEach(btn => {
              btn.addEventListener("click", async e => {
                const key = e.target.dataset.key;
                if (confirm("¿Eliminar esta asistencia?")) {
                  await remove(ref(db, `asistencias/${key}`));
                  showSuccess("Asistencia eliminada");
                }
              });
            });
          }
        });
      };

      const registrarAsistencia = async () => {
        if (attendanceRecords[`${currentUser}_${hoyFecha()}`]) {
          showError("Ya registraste tu asistencia hoy.");
          return;
        }
        loader.style.display = "block";

        const hora = new Date().toLocaleTimeString();

        // Capturar imagen de video en canvas y convertir a base64 (opcional para guardarlo)
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageBase64 = canvas.toDataURL("image/png");

        try {
          await push(ref(db, "asistencias"), {
            user: currentUser,
            role: userRole,
            date: hoyFecha(),
            time: hora,
            photo: imageBase64
          });
          showSuccess("Asistencia registrada con éxito!");
        } catch {
          showError("Error al registrar asistencia.");
        }
        loader.style.display = "none";
      };

      const logout = () => {
        stopCamera();
        currentUser = "";
        userRole = "";
        attendanceRecords = {};
        $("login-form").style.display = "block";
        document.querySelector(".container").style.display = "none";
        mensaje.textContent = "";
        feedback.textContent = "";
        $("username").value = "";
        $("password").value = "";
      };

      const descargarExcel = () => {
        const table = $("admin-attendance");
        const wb = XLSX.utils.table_to_book(table, { sheet: "Asistencia" });
        XLSX.writeFile(wb, `Asistencia_${hoyFecha()}.xlsx`);
      };

      // Voz para login/registro (simplificado)
      const reconocimientoVoz = (callback) => {
        if (!('webkitSpeechRecognition' in window)) {
          alert("Tu navegador no soporta reconocimiento de voz.");
          return;
        }
        const recognition = new webkitSpeechRecognition();
        recognition.lang = "es-ES";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.start();

        recognition.onresult = (event) => {
          const texto = event.results[0][0].transcript.toLowerCase();
          callback(texto);
        };
        recognition.onerror = (e) => alert("Error de voz: " + e.error);
      };

      $("login-button").onclick = () => {
        login($("username").value.trim(), $("password").value.trim());
      };

      $("register-button").onclick = () => {
        register($("username").value.trim(), $("password").value.trim(), $("role-select").value);
      };

      $("logout-button").onclick = logout;

      $("capture").onclick = registrarAsistencia;

      $("download-excel").onclick = descargarExcel;

      $("voice-login").onclick = () => {
        reconocimientoVoz(texto => {
          const [user, pass] = texto.split(" ");
          login(user, pass);
        });
      };

      $("voice-register").onclick = () => {
        reconocimientoVoz(texto => {
          const [user, pass] = texto.split(" ");
          register(user, pass, $("role-select").value);
        });
      };
    });
  </script>
</body>
</html>
